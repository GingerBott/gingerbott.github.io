<!DOCTYPE html>
<html lang="en">
<head>
  <title>Pick Heads or Tails</title>
</head>
<body>

  <h1>Pick Heads or Tails</h1>

  <!-- Parent element #1 (class) with 2 child elements (ids) -->
  <section class="button-group">
    <button id="one">Heads</button>
    <button id="two" style="background-color: lightblue;">Tails</button>
  </section>

  <!-- Parent element #2 (class) with 2 child elements (ids) -->
  <section class="choice-group">
    <button id="three" style="background-color: lightgreen;">Choose Coin</button>
    <button id="four" style="background-color: lightcoral;">Reset</button>
  </section>

</body>
</html>
